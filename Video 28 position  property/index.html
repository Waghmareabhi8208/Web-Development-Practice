<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .parent{
            height: 600px;
            width: 800px;
            border: 2px solid black;
            margin: 50px;
            /* position: absolute; */
            /* position: relative; */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }

        .box1{

            /* transform, perspective and filter can also make an element appear as positioned */

            background-color: lightblue;
            /* position: sticky; */
            position : absolute;
            /* position: fixed; */
            /* position: relative; */
            width: 125px;
            height: 50px;
            margin: 0px;
            padding: 0px;
            top : 0px;
            left: 0px;
        }
        .box2{
            background-color: lightgreen;
            /* position: relative; */
            bottom: 50px;
            left: 20px;
        }

        .box3{
            background-color: lightcoral;
            /* position: relative; */
            bottom: 100px;
            left: 40px;
        }

        .box4{
            background-color: lightgoldenrodyellow;
            /* position: relative; */
            bottom: 150px;
            left: 60px;
        }

        .box{
            height: 100px;
            width: 500px;
            padding: 10px;
            margin: 30px;
            border: 2px solid black;
            box-shadow: 10px 10px 10px grey;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
   
</body>
</html>
