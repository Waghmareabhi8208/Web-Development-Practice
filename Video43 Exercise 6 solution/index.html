<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6 Navbar using Flexbox Solution</title>
    <style>
        .logo {
            /* width: 100px;
            height: 50px; */
            display: inline-block;
        }

        .logo img {
            width: 60px;
            height: 40px;
            object-fit: contain;
        }

        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            /* background-color: #f8f8f8; */
            font-family: "segoe ui";
            font-size: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .right ul {
            display: flex;
            gap : 10px;
        }

        .right ul li {
            list-style: none;
            cursor: pointer;
            display: flex;
            
        }

    </style>
</head>
