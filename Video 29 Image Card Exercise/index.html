<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Card</title>
    <style>
        .card {
            width: 300px;
            height: 500px;
            border: 1px grey solid;
            /* margin: 150px; */
            border-radius: 20px;
            position: absolute;
            background-color: white;
            box-shadow: 1px 1px 10px grey;
        }

        img {
            border-radius: 10px;
            position: relative;
            top: 20px;
            left: 25px;
        }

        span {
            position: relative;
            top: 40px;
            left: 30px;
            font-size: 20px;
            padding: 3px 5px;
            border: 1px grey solid;
            border-radius: 5px;
            margin-right: 20px;
            background-color: rgb(255, 254, 254);
            box-shadow: 1px 1px 5px grey;
        }

        .content {
            position: relative;
            top: 60px;
            left: 25px;
            width: 260px;
            font-size: 15px;
        }
        .title {
            position: relative;
            top: 50px;
            left: 25px;
            font-size: 25px;
        }

        button {
            position: relative;
            top: 80px;
            left: 90px;
            width: 100px;
            height: 30px;
            border-radius: 10px;
            background-color: rgb(202, 230, 240);
            color: rgb(47, 47, 184);
            border: none;
            font-size: 15px;
            box-shadow: 1px 1px 5px grey;
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="image">
            <img src="NZ.jpg" alt="This is an image" width="250px" height="150px">
        </div>
        <span >Nature</span>
        <span>Lake</span>
        <h1 class="title">NewZeland Lake</h1>
        <div class="content">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Saepe, ullam! Maiores voluptatibus quod ipsam, a harum corporis tempore ab nulla totam dolorum itaque ipsum ut assumenda porro, fuga eaque! Rerum.</div>

        <button>Read More</button>
    </div>
</body>
</html>
